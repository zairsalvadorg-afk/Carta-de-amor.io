<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una pregunta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6e3e1;--paper:#fffaf6;--ink:#4a1626;--rose:#c2385a;--rose2:#8f2243;--muted:#8a5a66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d17;--paper:#3a1422;--ink:#fbe6e8;--rose:#e8607f;--rose2:#c2385a;--muted:#d6a3b0}}
:root[data-theme="dark"]{--bg:#2a0d17;--paper:#3a1422;--ink:#fbe6e8;--rose:#e8607f;--rose2:#c2385a;--muted:#d6a3b0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.card{position:relative;width:100%;max-width:460px;background:var(--paper);border-radius:6px;padding:44px 28px 36px;text-align:center;box-shadow:0 2px 0 var(--rose),0 24px 50px -24px rgba(74,22,38,.45);z-index:2;min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.hand{font-family:"Caveat","Segoe Script",cursive;font-size:1.6rem;color:var(--rose);margin:0 0 6px}
h1{font-weight:500;font-size:clamp(2rem,8vw,2.8rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
p{margin:0 0 22px;line-height:1.6;color:var(--muted);font-size:1.05rem;max-width:34ch}
.heart{font-size:3.2rem;line-height:1;margin-bottom:10px;display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
.btns{position:relative;display:flex;gap:14px;justify-content:center;align-items:center;height:70px;width:100%}
button{font:inherit;font-size:1.05rem;border:0;border-radius:999px;cursor:pointer;padding:13px 26px;transition:transform .2s}
#si{background:var(--rose);color:#fff;font-weight:500;box-shadow:0 8px 20px -8px var(--rose2)}
#si:hover{background:var(--rose2)}
#no{background:transparent;color:var(--muted);border:1px solid var(--muted)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hint{font-family:"Caveat",cursive;font-size:1.3rem;color:var(--rose);min-height:1.6em;margin:6px 0 0}
#ok{display:none}
.done #ask{display:none}.done #ok{display:flex;flex-direction:column;align-items:center}
.petal{position:fixed;top:-30px;font-size:22px;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}.petal{display:none}}

.bg{position:fixed;inset:0;z-index:0;background:#2a0d17}
.bg .s{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(12px) brightness(.6) saturate(1.15);transform:scale(1.15);opacity:0;transition:opacity 1.8s}
.bg .s.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1.28)}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(194,56,90,.22),rgba(42,13,23,.55))}
.card{background:rgba(255,250,246,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity 1.2s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{background:rgba(58,20,34,.84)}}
:root[data-theme="dark"] .card{background:rgba(58,20,34,.84)}
.ready .card{opacity:1;visibility:visible}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(20,5,12,.55);transition:opacity 1.2s;padding:20px}
#intro.out{opacity:0;pointer-events:none}
.pol{margin:0;background:#fffaf6;padding:12px 12px 14px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.55);width:min(62vw,250px);opacity:0;transform:rotate(-3deg) translateY(24px)}
.pol.in{animation:pin 1s ease forwards}
.pol.alt{transform:rotate(3deg) translateY(24px)}
@keyframes pin{to{opacity:1;transform:rotate(var(--r,-3deg)) translateY(0)}}
.pol img{display:block;width:100%;max-height:48vh;object-fit:cover;border-radius:2px}
#cap{font-family:"Caveat","Segoe Script",cursive;font-size:clamp(1.6rem,6vw,2.2rem);color:#fff;text-align:center;max-width:22ch;line-height:1.25;min-height:2.6em;text-shadow:0 2px 12px rgba(0,0,0,.6);transition:opacity .6s}
#skip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 16px;font-size:.9rem}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"><div class="s"></div><div class="s"></div><div class="s"></div></div>
<div id="intro">
  <button id="skip">Saltar</button>
  <figure class="pol" id="pol"><img id="polimg" alt=""></figure>
  <div id="cap" aria-live="polite"></div>
</div>
<main class="card" id="card">
  <section id="ask" style="width:100%">
    <div class="heart" aria-hidden="true">💗</div>
    <p class="hand" id="saludo">Hola, preciosa</p>
    <h1>¿Quieres ser mi enamorada?</h1>
    <p>Desde que te conozco, mis días tienen otro color. Quiero cuidarte, hacerte reír y caminar a tu lado.</p>
    <div class="btns" id="btns">
      <button id="si">Sí, quiero</button>
      <button id="no">No</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>
  <section id="ok">
    <div class="heart" aria-hidden="true">💖</div>
    <h1>¡Dijiste que sí!</h1>
    <p>Me hiciste la persona más feliz. Prometo cuidarte y quererte todos los días.</p>
    <p class="hand" style="font-size:2rem;margin:0">Te quiero mucho</p>
  </section>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),n=q.get("para");
  if(n)document.getElementById("saludo").textContent="Hola, "+n.slice(0,30);
  var si=document.getElementById("si"),no=document.getElementById("no"),hint=document.getElementById("hint"),btns=document.getElementById("btns");
  var msgs=["¿Segura?","Piénsalo bien…","Ese botón no funciona 😅","Mejor dile que sí","Última oportunidad…"];
  var c=0,scale=1;
  function dodge(e){
    if(e)e.preventDefault();
    c++;scale=Math.min(scale+.18,2.2);
    si.style.transform="scale("+scale+")";
    hint.textContent=msgs[Math.min(c-1,msgs.length-1)];
    var w=btns.clientWidth-no.offsetWidth,h=btns.clientHeight-no.offsetHeight;
    no.style.position="absolute";
    no.style.left=Math.max(0,Math.random()*w)+"px";
    no.style.top=Math.max(0,Math.random()*h)+"px";
  }
  no.addEventListener("mouseenter",dodge);
  no.addEventListener("touchstart",dodge,{passive:false});
  no.addEventListener("click",dodge);
  si.addEventListener("click",function(){
    document.getElementById("card").classList.add("done");
    var em=["🌹","💗","🌸","💖","❤️"];
    for(var i=0;i<40;i++){
      var p=document.createElement("span");
      p.className="petal";p.textContent=em[i%em.length];
      p.style.left=Math.random()*100+"vw";
      p.style.animationDuration=(3+Math.random()*4)+"s";
      p.style.animationDelay=(Math.random()*2)+"s";
      document.body.appendChild(p);
    }
  });
})();

(function(){
  var ss=document.querySelectorAll("#bg .s");
  ss.forEach(function(e,i){e.style.backgroundImage="url("+IMG[i]+")"});
  var cur=0;ss[0].classList.add("on");
  setInterval(function(){ss[cur].classList.remove("on");cur=(cur+1)%3;ss[cur].classList.add("on")},5500);
  var intro=document.getElementById("intro"),pol=document.getElementById("pol"),pi=document.getElementById("polimg"),cap=document.getElementById("cap");
  var seq=[[0,"Hay personas que le cambian el color a un día cualquiera…"],[1,"…con solo una sonrisa."],[2,"Y tú eres una de ellas."],[-1,"Por eso tengo algo que preguntarte…"]];
  var k=0,timer;
  function end(){clearTimeout(timer);intro.classList.add("out");document.body.classList.add("ready");setTimeout(function(){intro.style.display="none"},1300)}
  function step(){
    if(k>=seq.length)return end();
    var x=seq[k++];cap.style.opacity=0;
    setTimeout(function(){
      cap.textContent=x[1];cap.style.opacity=1;
      pol.classList.remove("in");void pol.offsetWidth;
      if(x[0]>=0){pi.src=IMG[x[0]];pol.style.setProperty("--r",(x[0]%2?3:-3)+"deg");pol.classList.add("in")}
      else pol.style.opacity=0;
    },x[0]>=0&&k>1?500:200);
    timer=setTimeout(step,x[0]>=0?4200:3000);
  }
  document.getElementById("skip").addEventListener("click",end);
  step();
})();
</script>
